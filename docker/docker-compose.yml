name: nicecode

services:
    postgres:
        image: postgres:17-alpine
        container_name: nicecode-dev
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-nicecode-dev}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - nicecode-dev-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    nicecode-dev-data:
