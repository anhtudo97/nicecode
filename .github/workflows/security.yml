name: Security

on:
    push:
        branches: [master]
    pull_request:
    schedule:
        # weekly: new advisories can hit unchanged dependencies
        - cron: "0 3 * * 1"

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# least privilege by default; jobs widen only what they need
permissions:
    contents: read

jobs:
    secrets:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0 # scan full history, not just the tip
            - uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    dependencies:
        name: Dependency audit (bun audit)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.0"
            - run: bun install --frozen-lockfile
              env:
                  # prisma generate (server postinstall) needs the var to load config; it never connects
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nicecode
            # fail on high/critical advisories in prod deps; dev-only tooling is reported by Dependabot
            - run: bun audit --prod --audit-level=high

    codeql:
        name: CodeQL (JS/TS)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v5
            - uses: github/codeql-action/init@v4
              with:
                  languages: javascript-typescript
                  queries: security-extended
            - uses: github/codeql-action/analyze@v4
              with:
                  category: /language:javascript-typescript
